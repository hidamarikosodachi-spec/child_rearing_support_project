# 自前サイトを毎朝ビルドして公開する（予約公開のため）。
#
# なぜ必要か:
#   docs/site/articles/*.md の `date` を未来にしておくと、その日が来るまで記事は出ない。
#   このワークフローが毎朝回ることで、**私が起動していなくても1日1本ずつ公開される**。
#   サイトの更新が止まって見えないようにするための仕組み（オーナー指示 2026-10-03）。
name: site daily deploy

on:
  schedule:
    - cron: '21 21 * * *'   # 毎日 06:21 JST
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo   # ランナーは既定で UTC。朝6時台に前日扱いになるのを防ぐ
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ビルド（予約日が来た記事だけ出る）
        run: python3 scripts/build_site_articles.py
      - name: 変更が無ければ終了
        id: diff
        run: |
          if git diff --quiet -- web/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Cloudflare Pages へ公開
        if: steps.diff.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest pages deploy web --project-name hidamari-kosodachi --commit-dirty=true
      - name: 生成物をコミット
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "hidamarikosodachi-spec"
          git config user.email "fuga.shiojiri.fa@gmail.com"
          git add web/
          git commit -m "chore(site): 予約公開の記事を反映（自動）"
          git push
